server {
    listen 8001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include MIME types
    include /etc/nginx/mime.types;
    types {
        text/css css;
        application/javascript js mjs;
        text/html html htm;
    }
    default_type application/octet-stream;

    # Logging for debugging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve assets directory with correct MIME types
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        
        # CSS files
        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
        
        # JavaScript files
        location ~* \.(js|mjs)$ {
            add_header Content-Type "application/javascript; charset=utf-8" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
        
        # Images
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
        
        # Fonts
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
        }
    }

    # Serve static files from root
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        
        # CSS files
        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
        
        # JavaScript files
        location ~* \.(js|mjs)$ {
            add_header Content-Type "application/javascript; charset=utf-8" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Type "text/html; charset=utf-8" always;
        try_files $uri =404;
    }

    # Handle React Router (SPA) - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
