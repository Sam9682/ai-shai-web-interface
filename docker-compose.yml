services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-shai-web-interface-postgres-${USER_ID:-1}-5432
    environment:
      POSTGRES_DB: shai_db
      POSTGRES_USER: shai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shai_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${HTTPS_PORT2:-6002}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shai_user -d shai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shai-network-${USER_ID:-1}

  # SHAI Web Interface Application (Backend API)
  ai-shai-web-interface:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-shai-web-interface-app-${USER_ID:-1}-${HTTP_PORT:-5000}
    ports:
      - "${HTTP_PORT:-6000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://shai_user:${POSTGRES_PASSWORD:-shai_password}@postgres:5432/shai_db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DOMAIN=${DOMAIN:-localhost}
      - API_URL=${API_URL:-http://ai-shai-web-interface:8000}
      - SSL_EMAIL=${SSL_EMAIL:-admin@example.com}
    volumes:
      - app_data:/app/storage
      - ./ssl:/app/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ai-shai-web-interface:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shai-network-${USER_ID:-1}

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-shai-web-interface-frontend-${USER_ID:-1}-${HTTP_PORT2:-5000}
    ports:
      - "${HTTP_PORT2:-6003}:8001"
    environment:
      - VITE_API_URL=/api
    restart: unless-stopped
    networks:
      - shai-network-${USER_ID:-1}

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-shai-web-interface-nginx-${USER_ID:-1}-${HTTPS_PORT:-5000}
    ports:
      - "${HTTPS_PORT:-6001}:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-shai-web-interface
      - frontend
    restart: unless-stopped
    environment:
      - HTTP_PORT=${HTTP_PORT:-6000}
      - HTTPS_PORT=${HTTPS_PORT:-6001}
    networks:
      - shai-network-${USER_ID:-1}

volumes:
  postgres_data:
  app_data:

networks:
  shai-network:
    driver: bridge
    name: shai-network-${USER_ID:-1}
